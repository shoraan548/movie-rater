# Publishes the app to GitHub Pages, inserting the OMDb key from the repo secret OMDB_KEY.
# Needs: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with OMDb key
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/catalog.json site/data/
          sed "s|__OMDB_KEY__|${OMDB_KEY}|" app.js > site/app.js
          if [ -z "$OMDB_KEY" ]; then echo "::warning::Secret OMDB_KEY is not set — posters will come from Wikipedia only"; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
