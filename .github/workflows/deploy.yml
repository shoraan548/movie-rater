# Publishes the app to GitHub Pages, inserting the OMDb key from the repo secret OMDB_KEY.
# Needs: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with OMDb key
        env:
          # a repository secret normally; also accepted as a repository variable
          OMDB_KEY: ${{ secrets.OMDB_KEY || vars.OMDB_KEY }}
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/catalog.json site/data/
          OMDB_KEY="$(printf '%s' "$OMDB_KEY" | tr -d '[:space:]')"
          sed "s|__OMDB_KEY__|${OMDB_KEY}|" app.js > site/app.js
          echo "OMDb key length: ${#OMDB_KEY}"
          if [ -z "$OMDB_KEY" ]; then echo "::warning::OMDB_KEY is not set (Settings → Secrets and variables → Actions → Repository secrets) — posters will come from Wikipedia only"; fi
          if grep -q "__OMDB_KEY__" site/app.js; then echo "::warning::OMDb key was not inserted into app.js"; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
